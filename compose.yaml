services:
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: "postgresql://kartoteka:kartoteka_dev@database:5432/kartoteka?serverVersion=18&charset=utf8"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: kartoteka
      POSTGRES_USER: kartoteka
      POSTGRES_PASSWORD: kartoteka_dev
    volumes:
      - postgres_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kartoteka -d kartoteka"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  postgres_db:
  frontend_node_modules: